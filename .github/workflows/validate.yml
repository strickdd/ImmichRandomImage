name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio aiohttp voluptuous

      - name: Lint with ruff
        run: ruff check custom_components/ tests/ tests_ha/

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Validate manifest
        run: |
          python -c "
          import json
          with open('custom_components/immich_random/manifest.json') as f:
              m = json.load(f)
          assert m['domain'] == 'immich_random', 'domain mismatch'
          assert m['config_flow'] is True, 'config_flow must be true'
          assert m['version'], 'version required'
          print('Manifest OK')
          "

  ha-integration:
    name: Integration tests (real Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test-ha.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test-ha.txt

      - name: Run integration tests
        run: PYTHONPATH=. python -m pytest tests_ha/ -v
