[project]
name = "ImmichRandomImage"
version = "1.4.1"
description = "Home Assistant custom integration for random Immich images"
license = "MIT"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line length — HA integrations often have long lines
